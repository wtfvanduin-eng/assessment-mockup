<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tidalex · Material Provision Assessment — corrected mockup</title>
<style>
:root{ --tidal:#0e7c86; --tidal-deep:#0a5b62; --tidal-tint:#e6f2f3; --ink:#14201f; --mute:#6b7674; --line:#dfe3e2; --bg:#f7f8f8; --card:#fff; --some:#bd7413; --box:rgba(14,124,134,.14);
       --met:#2f7d4f; --met-tint:#e9f4ec; --gap:#b4471f; --gap-tint:#fbeee8; --out:#6b7674; --out-tint:#eef0ef; --faint:#b3bab9; }
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{grid-template-columns:minmax(0,1fr);font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.5;display:grid;grid-template-rows:auto 1fr;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:2px;padding:6px 12px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--tidal)}
button:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--tidal);outline-offset:1px}
button.primary{background:var(--tidal);border-color:var(--tidal);color:#fff}
button.primary:hover:not(:disabled){background:var(--tidal-deep)}
button:disabled{color:#a9b0af;border-color:var(--line);cursor:default}
input[type=text],textarea,select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:2px;padding:5px 8px;width:100%}
textarea{resize:vertical;min-height:38px;line-height:1.45}
header{background:var(--card);border-bottom:1px solid var(--line)}
.hbar{padding:12px 28px;display:flex;align-items:baseline;gap:18px}
.brand{font-size:15px;font-weight:600;letter-spacing:.08em}
.prod{color:var(--tidal);font-weight:500}
.hbar .right{margin-left:auto;display:flex;gap:18px;font-size:12px;color:var(--mute);align-items:baseline;min-width:0}
.hbar .right>*{white-space:nowrap}
.hbar .right #layerinfo{white-space:normal;min-width:0;text-align:right}
.hbar .right button{padding:3px 9px;font-size:12px}
.hbar .right .fx{color:var(--some)}
nav.top{padding:0 28px;display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--card)}
nav.top a{padding:10px 14px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.top a.on{color:var(--tidal-deep);border-bottom-color:var(--tidal)}
nav.top a.off{color:#b3bab9}
main{display:grid;grid-template-columns:262px 372px minmax(0,1fr);gap:20px;padding:20px 28px;min-height:0;transition:grid-template-columns .15s}
main.c1{grid-template-columns:34px 372px minmax(0,1fr)}
main.c2{grid-template-columns:262px 34px minmax(0,1fr)}
main.c1.c2{grid-template-columns:34px 34px minmax(0,1fr)}
.rail{display:none}
main.c1 aside>*:not(.rail),main.c2 section.queue>*:not(.rail){display:none}
main.c1 aside .rail,main.c2 section.queue .rail{display:flex}
.rail{flex-direction:column;align-items:center;gap:10px;padding:10px 0;background:var(--card);border:1px solid var(--line);height:100%}
.rail .lab{writing-mode:vertical-rl;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rail button{padding:2px 6px;font-size:12px;line-height:1.2}
.colbtn{padding:2px 7px;font-size:12px;line-height:1.2;color:var(--mute)}
main>*{min-height:0;min-width:0}
/* left */
aside{display:flex;flex-direction:column;gap:14px;overflow:auto}
.card{background:var(--card);border:1px solid var(--line)}
.listbox{padding:14px 18px;position:relative}
.collapse{position:absolute;right:6px;top:6px}
.qtop{position:relative}
.qtop .collapse{right:6px;top:6px}
.listbox .name{font-size:17px;font-weight:600;margin-top:2px;min-height:24px;overflow-wrap:anywhere}
.listbox .name.empty{color:#b3bab9;font-weight:400;font-style:italic}
.listbox .count{margin-top:10px;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.listbox .count small{font-size:12.5px;font-weight:400;color:var(--mute);margin-left:6px}
.listbox .split{margin-top:6px;font-size:12px;color:var(--mute)}
.listbox .split b{color:var(--ink);font-weight:500}
.listbox .split a{color:var(--tidal-deep);cursor:pointer;border-bottom:1px solid transparent}
.listbox .split a:hover{border-bottom-color:var(--tidal)}
.listbox .meta{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.55}
.listbox .meta b{color:var(--ink);font-weight:500}
.listbox .unsaved{color:#8a6a12;font-size:12px;margin-top:6px}
.btns{padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{width:100%}
.how{padding:12px 18px;font-size:12px;color:var(--mute);line-height:1.55}
.how b{color:var(--ink);font-weight:500}
.how .sw{display:flex;align-items:center;gap:7px;color:var(--ink);cursor:pointer;margin-top:4px}
.how kbd{font:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:2px;padding:0 4px;background:#fff;color:var(--ink)}
/* queue */
section.queue{display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:minmax(0,1fr);min-height:0}
section.queue>*,section.unit>*{min-width:0}
.qtop{padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.qtop .srch{display:flex;gap:8px;align-items:center}
.qtop .srch input{flex:1;min-width:120px}
.qtop .srch button{flex:0 1 auto;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--mute);background:#fff;white-space:nowrap}
.chip b{color:var(--ink);font-weight:500}
.chip.on{border-color:var(--tidal);color:var(--tidal-deep);background:var(--tidal-tint)}
.chip.on b{color:var(--tidal-deep)}
.flt{font-size:11.5px;color:var(--mute);display:flex;align-items:center;gap:5px}
.flt select{font:inherit;font-size:11.5px;padding:1px 4px;width:auto;max-width:140px}
.passlab{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);align-self:center}
.viewrow{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--mute)}
.viewrow select{flex:1;font:inherit;font-size:12px;padding:3px 6px}
.viewrow button{padding:3px 8px;font-size:11.5px}
.bar{padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar b{color:var(--ink);font-weight:500}
.bar .sp{flex:1}
.bar button{padding:3px 8px;font-size:11.5px}
.qbody{overflow:auto;position:relative}
.qi{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:7px 14px 7px 12px;border-bottom:1px solid #eef1f0;cursor:pointer;align-items:start}
.qi:hover{background:#fafbfb}
.qi.on{background:var(--tidal-tint);box-shadow:inset 3px 0 0 var(--tidal)}
.qi .cb{margin-top:4px}
.qi .n{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.qi .n .tag{margin-left:6px}
.qi .d{font-size:11.5px;color:var(--mute);line-height:1.4;margin-top:1px}
.qi .st{font-size:11.5px;white-space:nowrap;text-align:right;line-height:1.35;margin-top:1px}
.qi .st .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:baseline;background:#dfe3e2}
.st.met{color:var(--met)}.st.met .dot{background:var(--met)}
.st.not{color:var(--gap)}.st.not .dot{background:var(--gap)}
.st.partly{color:var(--some)}.st.partly .dot{background:var(--some)}
.st.out{color:var(--out)}.st.out .dot{background:var(--out)}
.st.mixed{color:var(--some)}.st.mixed .dot{background:var(--some)}
.st.none{color:var(--faint)}
.qi.faded .n,.qi.faded .d{color:var(--faint)}
.qgroup{padding:10px 14px 4px;font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid #eef1f0;background:#fafbfb}
.cb{width:14px;height:14px;border:1.5px solid #8b9694;border-radius:2px;flex:none;position:relative;background:#fff;display:inline-block;vertical-align:middle;cursor:pointer}
.cb.full{background:var(--tidal);border-color:var(--tidal)}
.cb.full::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:2px;padding:0 5px;font-size:11px;color:var(--mute);white-space:nowrap;vertical-align:baseline;line-height:1.5}
.tag.tid{border-color:#e0dcc9;background:#faf7ec;color:#7a6f45}
.tag.mine{border-color:#cfe4e6;background:var(--tidal-tint);color:var(--tidal-deep)}
.tag.met{border-color:#bfdcc8;background:var(--met-tint);color:var(--met)}
.tag.not{border-color:#efc7b5;background:var(--gap-tint);color:var(--gap)}
.tag.partly{border-color:#eacb9c;background:#fdf3e0;color:#8a6a20}
.tag.warn{border-color:#eacb9c;background:#fdf3e0;color:#8a6a20}
.tag.out{border-color:var(--line);background:var(--out-tint);color:var(--out)}
.tag.mixed{border-color:#eacb9c;background:#fdf3e0;color:#8a6a20}
/* unit */
section.unit{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr);min-height:0;background:transparent;border:0}
.lawcol{display:grid;grid-template-rows:auto auto minmax(0,1fr);min-height:0;min-width:0;background:var(--card);border:1px solid var(--line)}
.answer{background:var(--card);border:1px solid var(--line)}
.pane{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0}
/* wide: the law keeps the left, the answer sits beside it and scrolls on its own */
/* the law needs ~520px to read well; split only when both columns get their share */
@media (min-width:1700px){
  .pane{grid-template-columns:minmax(520px,1fr) minmax(430px,38%);gap:20px}
  .pane>#answer{overflow:auto;padding-top:0}
  #b-toggle{display:none}
}
@media (min-width:1480px){
  main.c1 .pane,main.c2 .pane{grid-template-columns:minmax(520px,1fr) minmax(430px,38%);gap:20px}
  main.c1 .pane>#answer,main.c2 .pane>#answer{overflow:auto;padding-top:0;max-height:none}
  main.c1 .pane>.lawcol,main.c2 .pane>.lawcol{order:1}
  main.c1 #b-toggle,main.c2 #b-toggle{display:none}
}
@media (min-width:1280px){
  main.c1.c2 .pane{grid-template-columns:minmax(500px,1fr) minmax(400px,40%);gap:20px}
  main.c1.c2 .pane>#answer{overflow:auto;padding-top:0;max-height:none}
  main.c1.c2 .pane>.lawcol{order:1}
}
/* narrow: the answer lies over the law, and can be pushed aside */
@media (max-width:1699px){
  .pane{display:flex;flex-direction:column;position:relative;gap:14px}
  .pane>#answer{flex:0 1 auto;max-height:54%;overflow:auto}
  .pane>.lawcol{flex:1 1 auto;min-height:0}
  .pane.hid>#answer{display:none}
}
#b-toggle{margin-left:8px}
.uhead{padding:14px 20px 12px;border-bottom:1px solid var(--line)}
.uhead .kind{display:flex;gap:10px;align-items:baseline}
.uhead h1{font-size:18px;font-weight:600;line-height:1.3;margin-top:2px;overflow-wrap:anywhere}
.uhead .sub{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.55}
.uhead .sub b{color:var(--ink);font-weight:500}
.uhead .nav{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.uhead .nav button{padding:3px 9px;font-size:12px}
.answer{padding:0 18px 14px;background:var(--card);display:grid;grid-template-columns:minmax(0,1fr);gap:9px 16px;align-items:start}
.answer .gaps{min-width:0}
.answer .lbl{font-size:12px;color:var(--mute);padding-top:6px;white-space:nowrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:5px 9px;display:flex;gap:6px;align-items:baseline}
.seg button kbd{font:inherit;font-size:10.5px;color:var(--mute);border:1px solid var(--line);border-bottom-width:2px;border-radius:2px;padding:0 4px;line-height:1.35;background:#fff}
.seg button.on{border-color:currentColor;font-weight:500}
.seg button.on kbd{border-color:currentColor;color:inherit;background:transparent}
.seg button.met.on{color:var(--met);background:var(--met-tint)}
.seg button.not.on{color:var(--gap);background:var(--gap-tint)}
.seg button.partly.on{color:var(--some);background:#fdf3e0}
.seg button.applies.on{color:var(--tidal-deep);background:var(--tidal-tint)}
.seg button.notapplies.on{color:var(--out);background:var(--out-tint)}
.seg button.out.on{color:var(--out);background:var(--out-tint)}
.seg button.ser.on{color:var(--gap);background:var(--gap-tint)}
.seg button.ser.on[data-v=low]{color:#2f7d4f;background:var(--met-tint)}
.seg button.ser.on[data-v=medium]{color:var(--some);background:#fdf3e0}
.seg button.ser.on[data-v=high]{color:var(--gap);background:var(--gap-tint)}
.seg button.ser.on[data-v=critical]{color:#8c1d1d;background:#f7e4e4}
.gapq{border:1px solid var(--line);margin-bottom:10px}
.gapq>.qh{display:flex;gap:10px;align-items:baseline;padding:8px 12px;background:#fbfcfc;border-bottom:1px solid var(--line)}
.gapq>.qh .num{font-weight:600;color:var(--mute);min-width:12px}
.gapq>.qh .tx{font-weight:500;line-height:1.4}
.gapq>.qh .seg{margin-left:auto;flex:none;flex-wrap:nowrap}
.gaps>.ghead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;flex-wrap:wrap;position:sticky;top:0;background:var(--card);padding:12px 0 8px;z-index:2;border-bottom:1px solid var(--line)}
.gaps>.ghead .eyebrow{max-width:100%}
.gaps>.ghead .who{margin-left:auto;font-size:12px;flex:none;color:var(--ink);font-weight:500;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gaps>.ghead .who .k{color:var(--mute);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.gaps>.ghead .assign{flex-basis:100%;font-size:11.5px;color:var(--mute);margin-top:2px}
.gaps>.ghead .assign .a{color:var(--tidal-deep);cursor:pointer;border-bottom:1px solid transparent}
.gaps>.ghead .assign .a:hover{border-bottom-color:var(--tidal)}
.gapq>.qb{padding:9px 12px;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:start}
.gapq>.qb .lbl{font-size:12px;color:var(--mute);padding-top:6px;white-space:nowrap}
.gapq.locked{opacity:.5}
.gapq .na{font-size:12px;color:#b3bab9;padding-top:6px;font-style:italic}
.gapq>.qh .lb{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:auto}
.gapq>.qh .lb+.seg{margin-left:10px}
.qb.docs .doc{display:flex;flex-direction:column;gap:5px;padding-bottom:6px;position:relative}
.qb.docs .doc .rm{position:absolute;right:0;top:6px;font-size:11.5px;color:var(--mute);cursor:pointer}
.qb.docs .doc .rm:hover{color:var(--gap)}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file{font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:1px 6px;background:#fff;display:inline-flex;gap:6px;align-items:baseline}
.file .sz{color:var(--mute)}
.file .x{cursor:pointer;color:var(--mute)}
.file .x:hover{color:var(--gap)}
.up{font-size:11.5px;color:var(--tidal-deep);cursor:pointer;border:1px dashed var(--line);border-radius:2px;padding:2px 8px}
.up:hover{border-color:var(--tidal)}
.up input{display:none}
.hint{font-size:11.5px;color:var(--mute)}
.snips{display:flex;gap:6px;margin-top:4px}
.snips select{flex:1;font:inherit;font-size:11.5px;padding:2px 4px;max-width:220px}
.snips button{padding:2px 8px;font-size:11.5px}
.addrow{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.qb.docs .doc input[type=text],.qb.docs .doc select{width:100%;font:inherit;font-size:12.5px;padding:5px 8px;border:1px solid var(--line);border-radius:2px;background:#fff}
.gapq>.qh{align-items:center}
.sevrow{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:start;padding:2px 0 4px}
.sevrow .lbl{font-size:12px;color:var(--mute);padding-top:6px;white-space:nowrap}
.sevrow .note{font-size:11.5px;color:var(--mute);grid-column:2}
.stateline{font-size:12px;color:var(--mute);padding:8px 0 0;line-height:1.5}
.stateline .warnline{color:#8a6a12}
.waitline{margin-top:3px;color:#8a6a12}
.waitline .a{color:var(--tidal-deep);cursor:pointer;border-bottom:1px solid transparent}
.waitline .a:hover{border-bottom-color:var(--tidal)}
.uhead .cluetag{margin-left:auto;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:2px;padding:1px 7px;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.answer .two{display:grid;grid-template-columns:1fr 240px;gap:10px}
.answer .rem{display:grid;grid-template-columns:1fr 150px;gap:10px}
.answer input[type=date]{font:inherit;font-size:12.5px;color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:5px 8px;width:100%;background:#fff}
.answer .foot{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mute);flex-wrap:wrap}
.answer .foot b{color:var(--ink);font-weight:500}
.answer .foot .sp{flex:1}
.answer .foot button{padding:4px 10px;font-size:12px}
.answer.lone .lbl{padding-top:6px}
.members{overflow:auto;padding:4px 0 20px}
.lawcol{order:2}
.answer{order:1}
@media (min-width:1480px){.lawcol{order:1}.answer{order:2}}
.path{padding:12px 20px 4px;font-size:12px;color:var(--mute);line-height:1.5}
.path .sep{margin:0 6px;color:#b3bab9}
.path b{color:var(--ink);font-weight:500}
.cardx{margin:6px 20px 0;border:1px solid var(--line);padding:9px 12px 8px;position:relative}
.cardx .a{display:flex;align-items:baseline;gap:8px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.cardx .a .step{color:var(--tidal-deep);font-weight:500}
.cardx .a .raw{font-family:ui-monospace,"IBM Plex Mono",Consolas,monospace;font-size:11px;margin-left:auto;color:#a9b0af}
.cardx .tx{margin-top:4px;line-height:1.55;max-width:74ch}
.cardx .tx.h{font-weight:500}
.cardx .f{display:flex;gap:6px;align-items:center;margin-top:7px;font-size:11.5px;color:var(--mute);flex-wrap:wrap}
.cardx .f .own{margin-left:auto;color:var(--tidal-deep);cursor:pointer;border-bottom:1px solid transparent;white-space:nowrap}
.cardx .f .own:hover{border-bottom-color:var(--tidal)}
.cardx .ownbox{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start}
.cardx .ownbox .lbl{font-size:11.5px;color:var(--mute);padding-top:5px}
.cardx .ownbox .seg button{padding:3px 8px;font-size:11.5px}
.cardx .ownbox .hint{padding-top:5px}
.cardx .ownbox textarea{min-height:32px;font-size:12px}
.cardx.diff{border-left:3px solid var(--some)}
.cardx.outside{opacity:.55;border-style:dashed}
.fold{margin:12px 20px 0;font-size:12px;color:var(--mute)}
.panels{margin:18px 20px 0;padding-top:0}
.ptabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fbfcfc;padding:8px 20px;border-bottom:1px solid var(--line)}
.phead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.ptab{font-size:11.5px;padding:2px 9px;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--mute);background:#fff;white-space:nowrap}
.ptab b{color:var(--ink);font-weight:500}
.ptab.on{border-color:var(--tidal);color:var(--tidal-deep);background:var(--tidal-tint)}
.ptab.on b{color:var(--tidal-deep)}
.ptab.sm{padding:1px 7px;border-radius:2px}
.pshow{margin-left:auto;display:flex;gap:5px;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.pe{border:1px solid var(--line);padding:8px 11px;margin-bottom:7px}

<h3>Corrected assessment model</h3>
<p>This mockup assesses a <b>Material Provision</b>, not a legal address or cluster. A final Requirement Cluster is the legal curation input; the system derives the Material Provision and its Assessment Package. Addresses remain the traceable source and legal context. The legal pane deliberately reconstructs those addresses into the normal reading structure of the legislation: article, paragraph, subparagraph, point and indent.</p>
<h3>Flow</h3>
<p><b>Requirement Cluster → Material Provision → Legal Context → Assessment Package → Applicability → Assessment Criteria → Finding → Submit / Review / Remediation.</b></p>
<ul><li><b>Applicability</b> is resolved for the organisation before substantive testing. Scope, qualifiers and exemptions do not become compliance answers.</li><li><b>Internal requirements</b> tests implementation/existence and documents.</li><li><b>Test of design</b> tests whether the implemented control is designed to satisfy the legally supported criteria.</li><li><b>Test of effectiveness</b> tests operation in practice and is never bulk-filled.</li><li>The displayed position is derived: implementation failure or design failure = <b>Not met</b>; design passes but effectiveness fails = <b>Partly met</b>; all three pass = <b>Met</b>.</li><li><b>Set aside</b> is an administrative workflow exception only. It is not a legal “not applicable” result.</li></ul>
<h3>Legal context</h3>
<p>The law pane separates <b>Requirement Provisions</b> from typed <b>Legal Context Provisions</b>: scoping, foundational, definitions, explanatory, exemptions and L1/L2 elaboration. The assessment uses the minimum legally sufficient context and preserves the underlying address identifiers and source text.</p>
<h3>Reproducibility</h3>
<p>An assessment snapshot is identified by its Material Provision, requirement-cluster identity, corpus/layer build, dictionary/context-map version and source fingerprints. Later regrouping must not silently rewrite a completed assessment.</p>

":"For the purposes of this Regulation, the following definitions apply (2).","category":"definition","actor":null,"operator":null,"sequence":33},{"locator":"EU:32022R2554:L1:ART4","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPI","article":"EU:32022R2554:L1:ART4","heading":"Proportionality principle","text":null,"category":"technical","actor":null,"operator":null,"sequence":34},{"locator":"EU:32022R2554:L1:ART4:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART4","article":"EU:32022R2554:L1:ART4","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":35,"clusters":[{"id":"Cluster_0001","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART4:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART4","article":"EU:32022R2554:L1:ART4","heading":null,"text":"Financial entities record how proportionality principle is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":36,"clusters":[{"id":"Cluster_0001","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART4:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART4","article":"EU:32022R2554:L1:ART4","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to proportionality principle, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":37,"clusters":[{"id":"Cluster_0001","role":"specification"}]},{"locator":"EU:32022R2554:L1:CHAPII","act":"32022R2554","kind":"chapter","parent":null,"article":null,"heading":"ICT risk management","text":null,"category":"technical","actor":null,"operator":null,"sequence":38},{"locator":"EU:32022R2554:L1:CHAPII-SI","act":"32022R2554","kind":"section","parent":"EU:32022R2554:L1:CHAPII","article":null,"heading":"Governance and organisation","text":null,"category":"technical","actor":null,"operator":null,"sequence":39},{"locator":"EU:32022R2554:L1:ART5","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SI","article":"EU:32022R2554:L1:ART5","heading":"Governance and organisation","text":null,"category":"technical","actor":null,"operator":null,"sequence":40},{"locator":"EU:32022R2554:L1:ART5:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART5","article":"EU:32022R2554:L1:ART5","heading":null,"text":"The management body of the financial entity defines, approves, oversees and is responsible for the implementation of all arrangements related to the ICT risk management framework.","category":"material","actor":"management_body","operator":"shall","sequence":41,"clusters":[{"id":"Cluster_0002","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART5:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART5","article":"EU:32022R2554:L1:ART5","heading":null,"text":"The management body bears the ultimate responsibility for managing the ICT risk of the financial entity; sets policies that aim to ensure high standards of availability, authenticity, integrity and confidentiality of data; sets clear roles and responsibilities for all ICT-related functions; and approves and periodically reviews the business continuity policy and the ICT response and recovery plans.","category":"material","actor":"management_body","operator":"shall","sequence":42,"clusters":[{"id":"Cluster_0002","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART5:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART5","article":"EU:32022R2554:L1:ART5","heading":null,"text":"Financial entities other than microenterprises establish a role to monitor the arrangements concluded with ICT third-party service providers, or designate a member of senior management responsible for overseeing the related risk exposure.","category":"material","actor":"management_body","operator":"shall","sequence":43,"clusters":[{"id":"Cluster_0002","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART5:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART5","article":"EU:32022R2554:L1:ART5","heading":null,"text":"Members of the management body actively keep up to date with sufficient knowledge and skills to understand and assess ICT risk and its impact on the operations of the financial entity, including by following specific training on a regular basis.","category":"material","actor":"management_body","operator":"shall","sequence":44,"clusters":[{"id":"Cluster_0002","role":"specification"}]},{"locator":"EU:32022R2554:L1:CHAPII-SII","act":"32022R2554","kind":"section","parent":"EU:32022R2554:L1:CHAPII","article":null,"heading":"ICT risk management framework","text":null,"category":"technical","actor":null,"operator":null,"sequence":45},{"locator":"EU:32022R2554:L1:ART6","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART6","heading":"ICT risk management framework","text":null,"category":"technical","actor":null,"operator":null,"sequence":46},{"locator":"EU:32022R2554:L1:ART6:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"Financial entities have a sound, comprehensive and well-documented ICT risk management framework as part of their overall risk management system, which enables them to address ICT risk quickly, efficiently and comprehensively and to ensure a high level of digital operational resilience.","category":"material","actor":"financial_entity","operator":"shall","sequence":47,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"The ICT risk management framework includes at least strategies, policies, procedures, ICT protocols and tools that are necessary to duly and adequately protect all information assets and ICT assets.","category":"material","actor":"financial_entity","operator":"shall","sequence":48,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to ict risk management framework, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":49,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"Financial entities other than microenterprises assign the responsibility for managing and overseeing ICT risk to a control function and ensure an appropriate level of independence of that function to avoid conflicts of interest.","category":"material","actor":"financial_entity","operator":"shall","sequence":50,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"The ICT risk management framework is documented and reviewed at least once a year, as well as upon the occurrence of major ICT-related incidents, and following supervisory instructions or conclusions derived from testing or audit processes.","category":"material","actor":"financial_entity","operator":"shall","sequence":51,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"Financial entities put in place documented arrangements covering ict risk management framework, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":52,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"The arrangements referred to in paragraph 6 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":53,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P8","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"The ICT risk management framework includes a digital operational resilience strategy setting out how the framework is implemented.","category":"material","actor":"financial_entity","operator":"shall","sequence":54,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P9","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to ict risk management framework, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":55,"clusters":[{"id":"Cluster_0003","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART6:P10","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART6","article":"EU:32022R2554:L1:ART6","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to ict risk management framework and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":56},{"locator":"EU:32022R2554:L1:ART7","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART7","heading":"ICT systems, protocols and tools","text":null,"category":"technical","actor":null,"operator":null,"sequence":57},{"locator":"EU:32022R2554:L1:ART7:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART7","article":"EU:32022R2554:L1:ART7","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to ict systems, protocols and tools and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":58},{"locator":"EU:32022R2554:L1:ART8","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART8","heading":"Identification","text":null,"category":"technical","actor":null,"operator":null,"sequence":59},{"locator":"EU:32022R2554:L1:ART8:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":60,"clusters":[{"id":"Cluster_0004","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART8:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"Financial entities record how identification is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":61,"clusters":[{"id":"Cluster_0004","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART8:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to identification, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":62,"clusters":[{"id":"Cluster_0004","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART8:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to identification and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":63},{"locator":"EU:32022R2554:L1:ART8:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying identification.","category":"material","actor":"esas","operator":"shall","sequence":64},{"locator":"EU:32022R2554:L1:ART8:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"Financial entities put in place documented arrangements covering identification, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":65,"clusters":[{"id":"Cluster_0004","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART8:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART8","article":"EU:32022R2554:L1:ART8","heading":null,"text":"The arrangements referred to in paragraph 6 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":66,"clusters":[{"id":"Cluster_0004","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART9","heading":"Protection and prevention","text":null,"category":"technical","actor":null,"operator":null,"sequence":67},{"locator":"EU:32022R2554:L1:ART9:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART9","article":"EU:32022R2554:L1:ART9","heading":null,"text":"For the purposes of adequately protecting ICT systems and with a view to organising response measures, financial entities continuously monitor and control the security and functioning of ICT systems and tools and minimise the impact of ICT risk through the deployment of appropriate tools, policies and procedures.","category":"material","actor":"financial_entity","operator":"shall","sequence":68,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART9","article":"EU:32022R2554:L1:ART9","heading":null,"text":"Financial entities design, procure and implement ICT security policies, procedures, protocols and tools that aim to ensure the resilience, continuity and availability of ICT systems, in particular those supporting critical or important functions.","category":"material","actor":"financial_entity","operator":"shall","sequence":69,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART9","article":"EU:32022R2554:L1:ART9","heading":null,"text":"Financial entities put in place documented arrangements covering protection and prevention, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":70,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART9","article":"EU:32022R2554:L1:ART9","heading":null,"text":"As part of the ICT risk management framework, financial entities:","category":"material","actor":"financial_entity","operator":"shall","sequence":71,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4:PT-A","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART9:P4","article":"EU:32022R2554:L1:ART9","heading":null,"text":"develop and document an information security policy defining rules to protect the availability, authenticity, integrity and confidentiality of data, information assets and ICT assets;","category":"material","actor":"financial_entity","operator":"shall","sequence":72,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4:PT-B","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART9:P4","article":"EU:32022R2554:L1:ART9","heading":null,"text":"following a risk-based approach, establish a sound network and infrastructure management structure using appropriate techniques, methods and protocols;","category":"material","actor":"financial_entity","operator":"shall","sequence":73,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4:PT-C","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART9:P4","article":"EU:32022R2554:L1:ART9","heading":null,"text":"implement policies that limit the physical or logical access to information assets and ICT assets to what is required for legitimate and approved functions and activities only;","category":"material","actor":"financial_entity","operator":"shall","sequence":74,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4:PT-D","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART9:P4","article":"EU:32022R2554:L1:ART9","heading":null,"text":"implement policies and protocols for strong authentication mechanisms and protection measures of cryptographic keys;","category":"material","actor":"financial_entity","operator":"shall","sequence":75,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4:PT-E","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART9:P4","article":"EU:32022R2554:L1:ART9","heading":null,"text":"implement documented policies, procedures and controls for ICT change management;","category":"material","actor":"financial_entity","operator":"shall","sequence":76,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART9:P4:PT-F","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART9:P4","article":"EU:32022R2554:L1:ART9","heading":null,"text":"have appropriate and comprehensive documented policies for patches and updates.","category":"material","actor":"financial_entity","operator":"shall","sequence":77,"clusters":[{"id":"Cluster_0005","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART10","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART10","heading":"Detection","text":null,"category":"technical","actor":null,"operator":null,"sequence":78},{"locator":"EU:32022R2554:L1:ART10:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART10","article":"EU:32022R2554:L1:ART10","heading":null,"text":"Financial entities have in place mechanisms to promptly detect anomalous activities, including ICT network performance issues and ICT-related incidents, and to identify potential material single points of failure.","category":"material","actor":"financial_entity","operator":"shall","sequence":79,"clusters":[{"id":"Cluster_0006","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART10:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART10","article":"EU:32022R2554:L1:ART10","heading":null,"text":"The detection mechanisms enable multiple layers of control, define alert thresholds and criteria to trigger and initiate incident response processes, including automatic alert mechanisms for relevant staff.","category":"material","actor":"financial_entity","operator":"shall","sequence":80,"clusters":[{"id":"Cluster_0006","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART10:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART10","article":"EU:32022R2554:L1:ART10","heading":null,"text":"Financial entities devote sufficient resources and capabilities to monitor user activity, the occurrence of ICT anomalies and ICT-related incidents, in particular cyber-attacks.","category":"material","actor":"financial_entity","operator":"shall","sequence":81,"clusters":[{"id":"Cluster_0006","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART10:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART10","article":"EU:32022R2554:L1:ART10","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to detection and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":82},{"locator":"EU:32022R2554:L1:ART11","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART11","heading":"Response and recovery","text":null,"category":"technical","actor":null,"operator":null,"sequence":83},{"locator":"EU:32022R2554:L1:ART11:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"As part of the ICT risk management framework, financial entities put in place a comprehensive ICT business continuity policy, which may be adopted as a dedicated specific policy forming an integral part of the overall business continuity policy.","category":"material","actor":"financial_entity","operator":"may","sequence":84,"clusters":[{"id":"Cluster_0007","role":"specification"},{"id":"Cluster_0039","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"Financial entities implement the ICT business continuity policy through dedicated, appropriate and documented arrangements, plans, procedures and mechanisms aiming to ensure the continuity of critical or important functions, respond to and resolve ICT-related incidents, activate plans with containment measures, and estimate preliminary impacts.","category":"material","actor":"financial_entity","operator":"shall","sequence":85,"clusters":[{"id":"Cluster_0007","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"As part of the ICT risk management framework, financial entities implement associated ICT response and recovery plans which, in the case of financial entities other than microenterprises, are subject to independent internal audit reviews.","category":"material","actor":"financial_entity","operator":"shall","sequence":86,"clusters":[{"id":"Cluster_0007","role":"specification"},{"id":"Cluster_0040","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"The arrangements referred to in paragraph 3 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":87,"clusters":[{"id":"Cluster_0007","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"Financial entities record how response and recovery is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":88,"clusters":[{"id":"Cluster_0007","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"Financial entities test the ICT business continuity plans and the ICT response and recovery plans at least yearly, as well as after substantive changes to ICT systems supporting critical or important functions.","category":"material","actor":"financial_entity","operator":"shall","sequence":89,"clusters":[{"id":"Cluster_0007","role":"specification"},{"id":"Cluster_0041","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to response and recovery and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":90},{"locator":"EU:32022R2554:L1:ART11:P8","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying response and recovery.","category":"material","actor":"esas","operator":"shall","sequence":91},{"locator":"EU:32022R2554:L1:ART11:P9","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"Financial entities put in place documented arrangements covering response and recovery, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":92,"clusters":[{"id":"Cluster_0007","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P10","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"The arrangements referred to in paragraph 9 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":93,"clusters":[{"id":"Cluster_0007","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART11:P11","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART11","article":"EU:32022R2554:L1:ART11","heading":null,"text":"Financial entities record how response and recovery is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":94,"clusters":[{"id":"Cluster_0007","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART12","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART12","heading":"Backup policies and procedures, restoration and recovery procedures and methods","text":null,"category":"technical","actor":null,"operator":null,"sequence":95},{"locator":"EU:32022R2554:L1:ART12:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":96,"clusters":[{"id":"Cluster_0008","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART12:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"Financial entities record how backup policies and procedures, restoration and recovery procedures and methods is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":97,"clusters":[{"id":"Cluster_0008","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART12:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to backup policies and procedures, restoration and recovery procedures and methods, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":98,"clusters":[{"id":"Cluster_0008","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART12:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to backup policies and procedures, restoration and recovery procedures and methods and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":99},{"locator":"EU:32022R2554:L1:ART12:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying backup policies and procedures, restoration and recovery procedures and methods.","category":"material","actor":"esas","operator":"shall","sequence":100},{"locator":"EU:32022R2554:L1:ART12:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"Financial entities put in place documented arrangements covering backup policies and procedures, restoration and recovery procedures and methods, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":101,"clusters":[{"id":"Cluster_0008","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART12:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART12","article":"EU:32022R2554:L1:ART12","heading":null,"text":"The arrangements referred to in paragraph 6 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":102,"clusters":[{"id":"Cluster_0008","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART13","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART13","heading":"Learning and evolving","text":null,"category":"technical","actor":null,"operator":null,"sequence":103},{"locator":"EU:32022R2554:L1:ART13:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to learning and evolving and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":104,"clusters":[{"id":"Cluster_0009","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART13:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying learning and evolving.","category":"material","actor":"esas","operator":"shall","sequence":105},{"locator":"EU:32022R2554:L1:ART13:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"Financial entities put in place documented arrangements covering learning and evolving, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":106,"clusters":[{"id":"Cluster_0010","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART13:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"The arrangements referred to in paragraph 3 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":107,"clusters":[{"id":"Cluster_0010","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART13:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"Financial entities record how learning and evolving is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":108,"clusters":[{"id":"Cluster_0010","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART13:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to learning and evolving, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":109,"clusters":[{"id":"Cluster_0010","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART13:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART13","article":"EU:32022R2554:L1:ART13","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to learning and evolving and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":110,"clusters":[{"id":"Cluster_0009","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART14","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART14","heading":"Communication","text":null,"category":"technical","actor":null,"operator":null,"sequence":111},{"locator":"EU:32022R2554:L1:ART14:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART14","article":"EU:32022R2554:L1:ART14","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":112,"clusters":[{"id":"Cluster_0011","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART14:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART14","article":"EU:32022R2554:L1:ART14","heading":null,"text":"Financial entities record how communication is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":113,"clusters":[{"id":"Cluster_0011","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART14:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART14","article":"EU:32022R2554:L1:ART14","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to communication, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":114,"clusters":[{"id":"Cluster_0011","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART15","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART15","heading":"Further harmonisation of ICT risk management tools, methods, processes and policies","text":null,"category":"technical","actor":null,"operator":null,"sequence":115},{"locator":"EU:32022R2554:L1:ART15:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART15","article":"EU:32022R2554:L1:ART15","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to further harmonisation of ict risk management tools, methods, processes and policies and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":116},{"locator":"EU:32022R2554:L1:ART16","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPII-SII","article":"EU:32022R2554:L1:ART16","heading":"Simplified ICT risk management framework","text":null,"category":"technical","actor":null,"operator":null,"sequence":117},{"locator":"EU:32022R2554:L1:ART16:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART16","article":"EU:32022R2554:L1:ART16","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":118,"clusters":[{"id":"Cluster_0012","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART16:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART16","article":"EU:32022R2554:L1:ART16","heading":null,"text":"Financial entities record how simplified ict risk management framework is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":119,"clusters":[{"id":"Cluster_0012","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART16:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART16","article":"EU:32022R2554:L1:ART16","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to simplified ict risk management framework, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":120,"clusters":[{"id":"Cluster_0012","role":"specification"}]},{"locator":"EU:32022R2554:L1:CHAPIII","act":"32022R2554","kind":"chapter","parent":null,"article":null,"heading":"ICT-related incident management, classification and reporting","text":null,"category":"technical","actor":null,"operator":null,"sequence":121},{"locator":"EU:32022R2554:L1:ART17","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART17","heading":"ICT-related incident management process","text":null,"category":"technical","actor":null,"operator":null,"sequence":122},{"locator":"EU:32022R2554:L1:ART17:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART17","article":"EU:32022R2554:L1:ART17","heading":null,"text":"Financial entities define, establish and implement an ICT-related incident management process to detect, manage and notify ICT-related incidents.","category":"material","actor":"financial_entity","operator":"shall","sequence":123,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART17","article":"EU:32022R2554:L1:ART17","heading":null,"text":"Financial entities record all ICT-related incidents and significant cyber threats and establish appropriate procedures and processes to ensure a consistent and integrated monitoring, handling and follow-up of ICT-related incidents.","category":"material","actor":"financial_entity","operator":"shall","sequence":124,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART17","article":"EU:32022R2554:L1:ART17","heading":null,"text":"The ICT-related incident management process:","category":"material","actor":"financial_entity","operator":"shall","sequence":125,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3:PT-A","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART17:P3","article":"EU:32022R2554:L1:ART17","heading":null,"text":"puts in place early warning indicators;","category":"material","actor":"financial_entity","operator":"shall","sequence":126,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3:PT-B","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART17:P3","article":"EU:32022R2554:L1:ART17","heading":null,"text":"establishes procedures to identify, track, log, categorise and classify ICT-related incidents according to their priority and severity;","category":"material","actor":"financial_entity","operator":"shall","sequence":127,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3:PT-C","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART17:P3","article":"EU:32022R2554:L1:ART17","heading":null,"text":"assigns roles and responsibilities that need to be activated for different ICT-related incident types and scenarios;","category":"material","actor":"financial_entity","operator":"shall","sequence":128,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3:PT-D","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART17:P3","article":"EU:32022R2554:L1:ART17","heading":null,"text":"sets out plans for communication to staff, external stakeholders and media, and for notification to clients;","category":"material","actor":"financial_entity","operator":"shall","sequence":129,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3:PT-E","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART17:P3","article":"EU:32022R2554:L1:ART17","heading":null,"text":"ensures that at least major ICT-related incidents are reported to relevant senior management;","category":"material","actor":"financial_entity","operator":"shall","sequence":130,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART17:P3:PT-F","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART17:P3","article":"EU:32022R2554:L1:ART17","heading":null,"text":"establishes ICT-related incident response procedures to mitigate impacts and ensure that services become operational and secure in a timely manner.","category":"material","actor":"financial_entity","operator":"shall","sequence":131,"clusters":[{"id":"Cluster_0013","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART18","heading":"Classification of ICT-related incidents and cyber threats","text":null,"category":"technical","actor":null,"operator":null,"sequence":132},{"locator":"EU:32022R2554:L1:ART18:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART18","article":"EU:32022R2554:L1:ART18","heading":null,"text":"Financial entities classify ICT-related incidents and determine their impact based on the following criteria:","category":"material","actor":"financial_entity","operator":"shall","sequence":133,"clusters":[{"id":"Cluster_0014","role":"specification"},{"id":"Cluster_0044","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P1:PT-A","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART18:P1","article":"EU:32022R2554:L1:ART18","heading":null,"text":"the number and relevance of clients or financial counterparts affected;","category":"material","actor":"financial_entity","operator":"shall","sequence":134,"clusters":[{"id":"Cluster_0014","role":"specification"},{"id":"Cluster_0042","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P1:PT-B","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART18:P1","article":"EU:32022R2554:L1:ART18","heading":null,"text":"the duration of the ICT-related incident, including the service downtime;","category":"material","actor":"financial_entity","operator":"shall","sequence":135,"clusters":[{"id":"Cluster_0014","role":"specification"},{"id":"Cluster_0043","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P1:PT-C","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART18:P1","article":"EU:32022R2554:L1:ART18","heading":null,"text":"the geographical spread with regard to the areas affected;","category":"material","actor":"financial_entity","operator":"shall","sequence":136,"clusters":[{"id":"Cluster_0014","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P1:PT-D","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART18:P1","article":"EU:32022R2554:L1:ART18","heading":null,"text":"the data losses that the ICT-related incident entails;","category":"material","actor":"financial_entity","operator":"shall","sequence":137,"clusters":[{"id":"Cluster_0014","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P1:PT-E","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART18:P1","article":"EU:32022R2554:L1:ART18","heading":null,"text":"the criticality of the services affected;","category":"material","actor":"financial_entity","operator":"shall","sequence":138,"clusters":[{"id":"Cluster_0014","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P1:PT-F","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART18:P1","article":"EU:32022R2554:L1:ART18","heading":null,"text":"the economic impact of the ICT-related incident.","category":"material","actor":"financial_entity","operator":"shall","sequence":139,"clusters":[{"id":"Cluster_0014","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART18","article":"EU:32022R2554:L1:ART18","heading":null,"text":"Financial entities classify cyber threats as significant based on the criticality of the services at risk, including the transactions and operations of the financial entity, the number or relevance of clients or financial counterparts targeted, and the geographical spread of the areas at risk.","category":"material","actor":"financial_entity","operator":"shall","sequence":140,"clusters":[{"id":"Cluster_0014","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART18:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART18","article":"EU:32022R2554:L1:ART18","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to classification of ict-related incidents and cyber threats, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":141,"clusters":[{"id":"Cluster_0014","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART19","heading":"Reporting of major ICT-related incidents and voluntary notification of significant cyber threats","text":null,"category":"technical","actor":null,"operator":null,"sequence":142},{"locator":"EU:32022R2554:L1:ART19:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"Financial entities report major ICT-related incidents to the relevant competent authority using the templates in Article 20.","category":"material","actor":"financial_entity","operator":"shall","sequence":143,"clusters":[{"id":"Cluster_0015","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying reporting of major ict-related incidents and voluntary notification of significant cyber threats.","category":"material","actor":"esas","operator":"shall","sequence":144,"clusters":[{"id":"Cluster_0016","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"Financial entities may, on a voluntary basis, notify significant cyber threats to the relevant competent authority when they deem the threat to be of relevance to the financial system, service users or clients.","category":"material","actor":"financial_entity","operator":"may","sequence":145,"clusters":[{"id":"Cluster_0015","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"Financial entities submit, within the time limits laid down under the technical standards, an initial notification, an intermediate report, and a final report when the root cause analysis has been completed.","category":"material","actor":"financial_entity","operator":"shall","sequence":146,"clusters":[{"id":"Cluster_0015","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"Financial entities record how reporting of major ict-related incidents and voluntary notification of significant cyber threats is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":147,"clusters":[{"id":"Cluster_0015","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to reporting of major ict-related incidents and voluntary notification of significant cyber threats, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":148,"clusters":[{"id":"Cluster_0015","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART19:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to reporting of major ict-related incidents and voluntary notification of significant cyber threats and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":149},{"locator":"EU:32022R2554:L1:ART19:P8","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART19","article":"EU:32022R2554:L1:ART19","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying reporting of major ict-related incidents and voluntary notification of significant cyber threats.","category":"material","actor":"esas","operator":"shall","sequence":150,"clusters":[{"id":"Cluster_0016","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART20","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART20","heading":"Harmonisation of reporting content and templates","text":null,"category":"technical","actor":null,"operator":null,"sequence":151},{"locator":"EU:32022R2554:L1:ART20:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART20","article":"EU:32022R2554:L1:ART20","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"esas","operator":"shall","sequence":152},{"locator":"EU:32022R2554:L1:ART21","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART21","heading":"Centralisation of reporting of major ICT-related incidents","text":null,"category":"technical","actor":null,"operator":null,"sequence":153},{"locator":"EU:32022R2554:L1:ART21:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART21","article":"EU:32022R2554:L1:ART21","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to centralisation of reporting of major ict-related incidents and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":154},{"locator":"EU:32022R2554:L1:ART21:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART21","article":"EU:32022R2554:L1:ART21","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying centralisation of reporting of major ict-related incidents.","category":"material","actor":"esas","operator":"shall","sequence":155,"clusters":[{"id":"Cluster_0017","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART21:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART21","article":"EU:32022R2554:L1:ART21","heading":null,"text":"Financial entities put in place documented arrangements covering centralisation of reporting of major ict-related incidents, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"esas","operator":"shall","sequence":156,"clusters":[{"id":"Cluster_0017","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART22","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART22","heading":"Supervisory feedback","text":null,"category":"technical","actor":null,"operator":null,"sequence":157},{"locator":"EU:32022R2554:L1:ART22:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART22","article":"EU:32022R2554:L1:ART22","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"competent_authority","operator":"shall","sequence":158,"clusters":[{"id":"Cluster_0018","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART22:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART22","article":"EU:32022R2554:L1:ART22","heading":null,"text":"Financial entities record how supervisory feedback is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"competent_authority","operator":"shall","sequence":159,"clusters":[{"id":"Cluster_0018","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART22:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART22","article":"EU:32022R2554:L1:ART22","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to supervisory feedback, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"competent_authority","operator":"shall","sequence":160,"clusters":[{"id":"Cluster_0018","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART23","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIII","article":"EU:32022R2554:L1:ART23","heading":"Operational or security payment-related incidents","text":null,"category":"technical","actor":null,"operator":null,"sequence":161},{"locator":"EU:32022R2554:L1:ART23:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART23","article":"EU:32022R2554:L1:ART23","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to operational or security payment-related incidents and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":162},{"locator":"EU:32022R2554:L1:CHAPIV","act":"32022R2554","kind":"chapter","parent":null,"article":null,"heading":"Digital operational resilience testing","text":null,"category":"technical","actor":null,"operator":null,"sequence":163},{"locator":"EU:32022R2554:L1:ART24","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIV","article":"EU:32022R2554:L1:ART24","heading":"General requirements for the performance of digital operational resilience testing","text":null,"category":"technical","actor":null,"operator":null,"sequence":164},{"locator":"EU:32022R2554:L1:ART24:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART24","article":"EU:32022R2554:L1:ART24","heading":null,"text":"For the purpose of assessing preparedness for handling ICT-related incidents, identifying weaknesses,
