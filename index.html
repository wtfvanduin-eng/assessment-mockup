deficiencies and gaps in digital operational resilience, and promptly implementing corrective measures, financial entities other than microenterprises establish, maintain and review a sound and comprehensive digital operational resilience testing programme as an integral part of the ICT risk management framework.","category":"material","actor":"financial_entity","operator":"shall","sequence":165,"clusters":[{"id":"Cluster_0019","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART24:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART24","article":"EU:32022R2554:L1:ART24","heading":null,"text":"The digital operational resilience testing programme includes a range of assessments, tests, methodologies, practices and tools to be applied in accordance with Articles 25 and 26.","category":"material","actor":"financial_entity","operator":"shall","sequence":166,"clusters":[{"id":"Cluster_0019","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART24:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART24","article":"EU:32022R2554:L1:ART24","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to general requirements for the performance of digital operational resilience testing, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":167,"clusters":[{"id":"Cluster_0019","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART24:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART24","article":"EU:32022R2554:L1:ART24","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to general requirements for the performance of digital operational resilience testing and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":168},{"locator":"EU:32022R2554:L1:ART24:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART24","article":"EU:32022R2554:L1:ART24","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying general requirements for the performance of digital operational resilience testing.","category":"material","actor":"esas","operator":"shall","sequence":169},{"locator":"EU:32022R2554:L1:ART24:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART24","article":"EU:32022R2554:L1:ART24","heading":null,"text":"Financial entities other than microenterprises ensure, at least yearly, that appropriate tests are conducted on all ICT systems and applications supporting critical or important functions.","category":"material","actor":"financial_entity","operator":"shall","sequence":170,"clusters":[{"id":"Cluster_0019","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART25","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIV","article":"EU:32022R2554:L1:ART25","heading":"Testing of ICT tools and systems","text":null,"category":"technical","actor":null,"operator":null,"sequence":171},{"locator":"EU:32022R2554:L1:ART25:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART25","article":"EU:32022R2554:L1:ART25","heading":null,"text":"The digital operational resilience testing programme provides for the execution of appropriate tests, such as vulnerability assessments and scans, open source analyses, network security assessments, gap analyses, physical security reviews, questionnaires and scanning software solutions, source code reviews, scenario-based tests, compatibility testing, performance testing, end-to-end testing and penetration testing.","category":"material","actor":"financial_entity","operator":"shall","sequence":172,"clusters":[{"id":"Cluster_0020","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART25:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART25","article":"EU:32022R2554:L1:ART25","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying testing of ict tools and systems.","category":"material","actor":"esas","operator":"shall","sequence":173},{"locator":"EU:32022R2554:L1:ART25:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART25","article":"EU:32022R2554:L1:ART25","heading":null,"text":"Financial entities put in place documented arrangements covering testing of ict tools and systems, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":174,"clusters":[{"id":"Cluster_0020","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIV","article":"EU:32022R2554:L1:ART26","heading":"Advanced testing of ICT tools, systems and processes based on TLPT","text":null,"category":"technical","actor":null,"operator":null,"sequence":175},{"locator":"EU:32022R2554:L1:ART26:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"The arrangements referred to in paragraph 1 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":176,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Financial entities record how advanced testing of ict tools, systems and processes based on tlpt is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":177,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to advanced testing of ict tools, systems and processes based on tlpt, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":178,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to advanced testing of ict tools, systems and processes based on tlpt and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":179,"clusters":[{"id":"Cluster_0022","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying advanced testing of ict tools, systems and processes based on tlpt.","category":"material","actor":"esas","operator":"shall","sequence":180,"clusters":[{"id":"Cluster_0023","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Financial entities put in place documented arrangements covering advanced testing of ict tools, systems and processes based on tlpt, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":181,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"The arrangements referred to in paragraph 6 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":182,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P8","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Financial entities record how advanced testing of ict tools, systems and processes based on tlpt is applied in practice and keep that record available to the competent authority on request.","category":"material","actor":"financial_entity","operator":"shall","sequence":183,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P9","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to advanced testing of ict tools, systems and processes based on tlpt, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":184,"clusters":[{"id":"Cluster_0021","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P10","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to advanced testing of ict tools, systems and processes based on tlpt and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":185,"clusters":[{"id":"Cluster_0022","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART26:P11","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART26","article":"EU:32022R2554:L1:ART26","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying advanced testing of ict tools, systems and processes based on tlpt.","category":"material","actor":"esas","operator":"shall","sequence":186,"clusters":[{"id":"Cluster_0023","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART27","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPIV","article":"EU:32022R2554:L1:ART27","heading":"Requirements for testers for the carrying out of TLPT","text":null,"category":"technical","actor":null,"operator":null,"sequence":187},{"locator":"EU:32022R2554:L1:ART27:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART27","article":"EU:32022R2554:L1:ART27","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to requirements for testers for the carrying out of tlpt and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":188},{"locator":"EU:32022R2554:L1:ART27:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART27","article":"EU:32022R2554:L1:ART27","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying requirements for testers for the carrying out of tlpt.","category":"material","actor":"esas","operator":"shall","sequence":189},{"locator":"EU:32022R2554:L1:ART27:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART27","article":"EU:32022R2554:L1:ART27","heading":null,"text":"Financial entities put in place documented arrangements covering requirements for testers for the carrying out of tlpt, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":190},{"locator":"EU:32022R2554:L1:CHAPV","act":"32022R2554","kind":"chapter","parent":null,"article":null,"heading":"Managing of ICT third-party risk","text":null,"category":"technical","actor":null,"operator":null,"sequence":191},{"locator":"EU:32022R2554:L1:CHAPV-SI","act":"32022R2554","kind":"section","parent":"EU:32022R2554:L1:CHAPV","article":null,"heading":"Key principles for a sound management of ICT third-party risk","text":null,"category":"technical","actor":null,"operator":null,"sequence":192},{"locator":"EU:32022R2554:L1:ART28","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPV-SI","article":"EU:32022R2554:L1:ART28","heading":"General principles","text":null,"category":"technical","actor":null,"operator":null,"sequence":193},{"locator":"EU:32022R2554:L1:ART28:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"Financial entities manage ICT third-party risk as an integral component of ICT risk within their ICT risk management framework and in accordance with the following principles:","category":"material","actor":"financial_entity","operator":"shall","sequence":194,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P1:PT-A","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART28:P1","article":"EU:32022R2554:L1:ART28","heading":null,"text":"financial entities that have in place contractual arrangements for the use of ICT services remain at all times fully responsible for compliance with all obligations under this Regulation;","category":"material","actor":"financial_entity","operator":"shall","sequence":195,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P1:PT-B","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART28:P1","article":"EU:32022R2554:L1:ART28","heading":null,"text":"management of ICT third-party risk is implemented in light of the principle of proportionality.","category":"material","actor":"financial_entity","operator":"shall","sequence":196,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"Financial entities other than microenterprises adopt, and regularly review, a strategy on ICT third-party risk, taking into account the multi-vendor strategy, which includes a policy on the use of ICT services supporting critical or important functions provided by ICT third-party service providers.","category":"material","actor":"financial_entity","operator":"shall","sequence":197,"clusters":[{"id":"Cluster_0024","role":"specification"},{"id":"Cluster_0045","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P3","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"As part of their ICT risk management framework, financial entities maintain and update at entity level, and at sub-consolidated and consolidated levels, a register of information in relation to all contractual arrangements on the use of ICT services provided by ICT third-party service providers.","category":"material","actor":"financial_entity","operator":"shall","sequence":198,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P4","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to general principles and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":199,"clusters":[{"id":"Cluster_0025","role":"specification"},{"id":"Cluster_0046","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P5","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying general principles.","category":"material","actor":"esas","operator":"shall","sequence":200},{"locator":"EU:32022R2554:L1:ART28:P6","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"Financial entities put in place documented arrangements covering general principles, proportionate to their size and overall risk profile, and to the nature, scale and complexity of their services.","category":"material","actor":"financial_entity","operator":"shall","sequence":201,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P7","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"The arrangements referred to in paragraph 6 are reviewed at least yearly and after any major ICT-related incident, and the outcome of that review is reported to the management body.","category":"material","actor":"financial_entity","operator":"shall","sequence":202,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P8","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"For ICT services supporting critical or important functions, financial entities put in place exit strategies that take into account risks that may emerge at the level of ICT third-party service providers.","category":"material","actor":"financial_entity","operator":"may","sequence":203,"clusters":[{"id":"Cluster_0024","role":"specification"},{"id":"Cluster_0047","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P9","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"Where a financial entity relies on an ICT third-party service provider in relation to general principles, the responsibility for meeting this Article remains with the financial entity.","category":"material","actor":"financial_entity","operator":"shall","sequence":204,"clusters":[{"id":"Cluster_0024","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART28:P10","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART28","article":"EU:32022R2554:L1:ART28","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to general principles and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":205,"clusters":[{"id":"Cluster_0025","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART29","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPV-SI","article":"EU:32022R2554:L1:ART29","heading":"Preliminary assessment of ICT concentration risk at entity level","text":null,"category":"technical","actor":null,"operator":null,"sequence":206},{"locator":"EU:32022R2554:L1:ART29:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART29","article":"EU:32022R2554:L1:ART29","heading":null,"text":"Competent authorities may request evidence of how the financial entity gives effect to preliminary assessment of ict concentration risk at entity level and may set a deadline for remedial action.","category":"material","actor":"competent_authority","operator":"may","sequence":207},{"locator":"EU:32022R2554:L1:ART29:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART29","article":"EU:32022R2554:L1:ART29","heading":null,"text":"The ESAs develop, through the Joint Committee, common draft regulatory technical standards further specifying preliminary assessment of ict concentration risk at entity level.","category":"material","actor":"esas","operator":"shall","sequence":208},{"locator":"EU:32022R2554:L1:ART30","act":"32022R2554","kind":"article","parent":"EU:32022R2554:L1:CHAPV-SI","article":"EU:32022R2554:L1:ART30","heading":"Key contractual provisions","text":null,"category":"technical","actor":null,"operator":null,"sequence":209},{"locator":"EU:32022R2554:L1:ART30:P1","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART30","article":"EU:32022R2554:L1:ART30","heading":null,"text":"The rights and obligations of the financial entity and of the ICT third-party service provider are clearly allocated and set out in writing, and the full contract includes the service level agreements and is documented in one written document available to the parties on paper or in a downloadable, durable and accessible format.","category":"material","actor":"financial_entity","operator":"shall","sequence":210,"clusters":[{"id":"Cluster_0026","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2","act":"32022R2554","kind":"paragraph","parent":"EU:32022R2554:L1:ART30","article":"EU:32022R2554:L1:ART30","heading":null,"text":"The contractual arrangements on the use of ICT services include at least the following elements:","category":"material","actor":"financial_entity","operator":"shall","sequence":211,"clusters":[{"id":"Cluster_0026","role":"specification"},{"id":"Cluster_0048","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2:PT-A","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART30:P2","article":"EU:32022R2554:L1:ART30","heading":null,"text":"a clear and complete description of all functions and ICT services to be provided;","category":"material","actor":"financial_entity","operator":"shall","sequence":212,"clusters":[{"id":"Cluster_0026","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2:PT-B","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART30:P2","article":"EU:32022R2554:L1:ART30","heading":null,"text":"the locations where the contracted or subcontracted functions and ICT services are to be provided and where data is to be processed;","category":"material","actor":"financial_entity","operator":"shall","sequence":213,"clusters":[{"id":"Cluster_0026","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2:PT-C","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART30:P2","article":"EU:32022R2554:L1:ART30","heading":null,"text":"provisions on availability, authenticity, integrity and confidentiality in relation to the protection of data;","category":"material","actor":"financial_entity","operator":"shall","sequence":214,"clusters":[{"id":"Cluster_0026","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2:PT-D","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART30:P2","article":"EU:32022R2554:L1:ART30","heading":null,"text":"provisions on ensuring access, recovery and return of data in the event of insolvency, resolution or discontinuation of the business operations;","category":"material","actor":"financial_entity","operator":"shall","sequence":215,"clusters":[{"id":"Cluster_0026","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2:PT-E","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART30:P2","article":"EU:32022R2554:L1:ART30","heading":null,"text":"service level descriptions, including updates and revisions thereof;","category":"material","actor":"financial_entity","operator":"shall","sequence":216,"clusters":[{"id":"Cluster_0026","role":"specification"}]},{"locator":"EU:32022R2554:L1:ART30:P2:PT-F","act":"32022R2554","kind":"point","parent":"EU:32022R2554:L1:ART30:P2","article":"EU:32022R2554:L1:ART3 function unitHasCriticalFunctionCondition(u){

    const p=L.byLoc.get(l)||{};
    if(re.test(p.text||'')) return true;
    const obs=Array.isArray(p.obligations)?p.obligations:[];
    return obs.some(o=>{
      const c=Array.isArray(o.condition)?o.condition:[o.condition];
      return c.filter(Boolean).some(x=>re.test(typeof x==='string'?x:(x.text||x.value||'')));

}
function unitHasObligation(u){

function unitHasLinkedControl(u){

function unitMatchesSmartQueue(u){

function humanNum(p,l){

  const seg=(l||'').split(':').pop()||'';
  if(p.kind==='paragraph'){ const m=seg.match(/^P(\d+)$/i); return m?m[1]+'.':''; }
  if(p.kind==='point'){ const m=seg.match(/^PT-(.+)$/i); return m?'('+m[1].toLowerCase()+')':''; }
  if(p.kind==='subparagraph'){ const m=seg.match(/^SUB-(.+)$/i); return m?'('+m[1].toLowerCase()+')':''; }
  if(p.kind==='recital'){ const m=seg.match(/^RCT(\d+)$/i); return m?'('+m[1]+')':''; }
  return '';
}
function articleAncestor(l){

function legalArticleGroup(locs,opts={}){

  for(const p of rows){ const a=articleAncestor(p.locator); const key=a?a.locator:(p.article||p.locator); if(!cur||cur.key!==key){ cur={key,a,rows:[]}; groups.push(cur); } cur.rows.push(p); }
  return groups.map(g=>{

    const title=a?`Article ${esc(articleNo(a))}${a.heading?' — '+esc(a.heading):''}`:(first.heading?esc(first.heading):esc(where(first.locator)));
    const band=opts.band||'Requirement provisions';

      const k=(p.kind||'').replace(/[^a-z-]/g,'');

    }).join('');
    const meta=opts.showMeta===false?'':`<div class="lawmeta"><span>${esc(actLevel(first.act))} ${esc(actShort(first.act))}</span><span>·</span><span>${esc(where(first.locator))}</span>${opts.inspect?`<span>·</span><span class="inspect" data-own="${esc(first.locator)}">Inspect source/provenance</span>`:''}</div>`;

}

function assessmentCriteria(u){
  const out=[]; let n=1;
  for(const l of (u.here||[])){
    const p=L.byLoc.get(l)||{};
    const obs=Array.isArray(p.obligations)?p.obligations:[];
    if(obs.length){
      for(const o of obs){
        if(!o || (o.modality && o.modality!=='obligation' && o.modality!=='prohibition')) continue;
        const act=typeof o.action==='string'?o.action:(o.action&&o.action.text)||'satisfy';
        const obj=typeof o.object==='string'?o.object:(o.object&&o.object.text)||'the legal requirement';
        const req=Array.isArray(o.requirement)?o.requirement.map(x=>typeof x==='string'?x:(x.text||x.value||'')).filter(Boolean).join('; '):'';
        const text=`${act.charAt(0).toUpperCase()+act.slice(1)} ${obj}${req?': '+req:''}`;
        out.push({id:'AC-'+String(n++).padStart(3,'0'),text,basis:where(l),locator:l});
      }
    }else if(p.text && p.category!=='scoping'){
      out.push({id:'AC-'+String(n++).padStart(3,'0'),text:cut(p.text,180),basis:where(l),locator:l});
    }
  }
  const seen=new Set();
  return out.filter(c=>{const k=c.text+'|'+c.basis;if(seen.has(k)) return false;seen.add(k);return true;}).slice(0,8);
}

function exportWork(){
  if(!W) return; const lst=listById(W.list_id); const cl=clusteringById(W.clustering_id);
  const cols=['Address','Act','Path','Heading','Actor','Operator','Role','Cluster','Cluster origin','Since taken',
    'Implemented','Documents and locations','Documents evidence',
    'Design compliant','Design explanation','Design evidence',
    'Effectiveness compliant','Effectiveness explanation','Effectiveness evidence',
    'Position','Severity','Function','Owner','Due','State','Submitted by','Reviewed by','Waiting on','Waiting for','By','At','In this work'];
  const rows=[cols];
  const aside=new Set(W.items.set_aside||[]);
  const all=[...new Set([...lst.locators,...W.items.added,...Object.keys(W.decisions)])].filter(l=>!W.items.removed.includes(l)).sort(lawOrder);
  for(const l of all){ const p=L.byLoc.get(l)||{}; const d=W.decisions[l]||{}; const cls=(MEMBER.get(l)||[]);
    const c0=cls[0]||{}; const role=cls.map(c=>(c.roles||{})[l]).find(Boolean)||'';
    const origin=c0.from?'Tidalex '+(c0.from_build||''):(cls.length?'own':'');
    const inWork=aside.has(l)||cls.some(c=>aside.has(c.id))?t('st.aside'):(W.items.added.includes(l)?t('kind.added',{n:''}).trim():'yes');
    const yn=v=>v===true?t('g.yes'):v===false?t('g.no'):'';
    rows.push([l,actShort(p.act),p.act?pathText(l)+' › '+stepOf(l):'',p.heading||'',actorLabel(p.actor)||'',opLabel(p.operator)||'',role,cls.map(c=>c.name).join('; '),origin,c0.since_taken||'',
      yn(d.implemented),(d.docs||[]).map(x=>x.name).filter(Boolean).join(' | '),(d.docs||[]).flatMap(x=>(x.files||[]).map(f=>f.name)).join(' | '),
      yn(d.design),d.note||'',(d.files||[]).map(f=>f.name).join(' | '),
      yn(d.effect),d.note2||'',(d.files2||[]).map(f=>f.name).join(' | '),
      d.position?posWord(d.position):'',d.seriousness?serWord(d.seriousness):'',d.function||'',d.owner||'',d.due||'',
      d.reviewed_by?t('st.reviewed'):(d.submitted_by?t('st.submitted'):(d.position?t('st.draft'):'')),d.submitted_by||'',d.reviewed_by||'',d.waiting_who||'',d.waiting_why||'',
      d.by||'',d.at||'',inWork]); }
  const name=(W.name||'work').replace(/[^\w.-]+/g,'_');
  if(window.XLSX){ const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Decisions'); XLSX.writeFile(wb,name+'.xlsx'); }
  else { const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=name+'.csv'; a.click(); }
  toast(t('msg.exported',{n:fmt(rows.length-1)}));
}
